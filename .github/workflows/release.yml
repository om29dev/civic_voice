name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code analysis
        run: flutter analyze

      - name: Run test suite
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare release assets and checksums
        id: assets
        run: |
          mkdir -p dist
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          TAG_VALUE="${{ inputs.tag_name }}"
          if [ -z "$TAG_VALUE" ]; then
            TAG_VALUE="${{ github.ref_name }}"
          fi

          cp "$APK_SRC" "dist/civicvoice-${TAG_VALUE}.apk"

          cd dist
          sha256sum "civicvoice-${TAG_VALUE}.apk" > civicvoice-checksums.txt
          cd ..

          echo "Prepared artifacts in dist:"
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: civicvoice-apk
          path: dist/
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            dist/civicvoice-*.apk
            dist/civicvoice-checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

