name: civic_voice_interface
description: Civic Voice Interface - A voice-first decision-intelligence system for government service navigation in Bharat.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  provider: ^6.1.2
  go_router: ^18.1.2

  # Voice & Language
  speech_to_text: 7.5.0
  flutter_tts: ^4.2.5

  # Backend
  shared_preferences: ^2.5.6
  http: ^1.1.0

  # Animations & UI
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  animate_do: ^5.1.0
  animated_text_kit: ^4.2.2
  shimmer: ^4.0.0
  confetti: ^0.8.0
  flutter_markdown: ^0.7.6

  # Visual Effects
  glassmorphism: ^4.0.0

  # Design & Icons
  google_fonts: ^9.0.0
  font_awesome_flutter: ^11.0.0

  # Charts & Data Viz
  fl_chart: ^1.3.0

  # Permissions & Device
  permission_handler: ^13.0.2
  geolocator: ^14.1.2
  google_maps_flutter: ^2.19.0
  connectivity_plus: ^7.0.0

  # Media
  record: ^7.1.2
  audioplayers: ^6.5.1
  image_picker: ^1.2.4
  image: ^4.12.0
  file_picker: ^13.3.2

  # Utilities
  url_launcher: ^6.3.3
  webview_flutter: ^4.4.0
  flutter_local_notifications: ^22.3.3
  path_provider: ^2.1.5
  intl: ^0.20.3
  countup: ^0.1.3
  csv: ^8.0.0

  timezone: 0.11.2

  # Security (Document Vault)
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.1
  flutter_image_compress: ^2.1.0
  amplify_flutter: ^2.16.0
  amplify_auth_cognito: ^2.16.0
  amplify_api: ^2.16.0
  amplify_storage_s3: ^2.16.0
  aws_signature_v4: ^0.6.10
  aws_common: ^0.7.16
  crypto: ^3.0.8
  convert: ^3.1.1
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/forms/
    - assets/prompts/
    - assets/flag/flag.html

  # Fonts are loaded via the google_fonts package (no local font files needed)
